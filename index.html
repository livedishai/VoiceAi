<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant AI Voice Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-active: #ef4444;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
      color: var(--accent);
    }
    .status {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 20px;
      color: #94a3b8;
    }
    .chat-box {
      height: 340px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      outline: none;
    }
    .input-row button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .mic-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-size: 1.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }
    .mic-btn.listening {
      background: var(--accent-active);
      color: white;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍽️ Restaurant Voice Assistant</h1>
    <div class="status" id="statusText">Ready — Tap mic or type below</div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hello! Welcome to our restaurant. Feel free to ask about our menu specials or book a table. How can I help you today?</div>
    </div>

    <!-- Text input option for testing without mic -->
    <div class="input-row">
      <input type="text" id="textInput" placeholder="Type a question or reservation details..." />
      <button id="sendBtn">Send</button>
    </div>

    <div class="controls">
      <button class="mic-btn" id="micBtn" title="Click to Speak">🎙️</button>
    </div>
  </div>

  <script>
    // Set your API key here (saved in localStorage for convenience)
    let GEMINI_API_KEY = localStorage.getItem("GEMINI_KEY") || "AQ.Ab8RN6J6-yzK2TCX_0jSgQ-7lKhaByCvXjgvmo0REUfAqu7TRQ";
    localStorage.setItem("GEMINI_KEY", GEMINI_API_KEY);

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwap82BOPazgkUfm5wwmywH2YfHlsPw5p6cIIo0vmTdIngrGkmd2h81cZU9vdtPshD9cg/exec";

    // Default menu & timings backup (used immediately so the app never gets stuck)
    let dynamicRestaurantInfo = `
Restaurant: Sakura Garden Japanese Restaurant
Address: 100 Feet Road, Indiranagar, Bengaluru
Timings: Lunch 12:00 PM - 3:30 PM | Dinner 7:00 PM - 11:30 PM
Menu Highlights:
- Agedashi Tofu (₹350): Crispy silken tofu in savory dashi broth (Vegetarian).
- Pan-seared Gyoza (₹420): Japanese dumplings with pork or vegetables.
- Truffle Mushroom Ramen (₹520): Miso broth, fresh noodles, wild shiitake (Vegetarian).
- Grilled Salmon Teriyaki (₹750): Norwegian salmon with homemade teriyaki glaze.
- Matcha Ice Cream (₹250): Classic green tea dessert.
`;

    let conversationHistory = [];
    const chatBox = document.getElementById("chatBox");
    const micBtn = document.getElementById("micBtn");
    const statusText = document.getElementById("statusText");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");

    // Initialize Web Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
        statusText.textContent = "Listening... Speak now";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        addMessage(transcript, "user");
        statusText.textContent = "Thinking...";
        await processUserMessage(transcript);
      };

      recognition.onerror = (event) => {
        console.error("Speech Error:", event.error);
        statusText.textContent = "Microphone error: " + event.error;
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      statusText.textContent = "Web Speech API not supported in this browser. Please use Chrome.";
    }

    function toggleListening() {
      if (!recognition) {
        alert("Microphone recognition is only supported in Google Chrome on desktop or Android.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error("Recognition start error:", e);
        }
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove("listening");
      statusText.textContent = "Ready — Tap mic or type below";
    }

    micBtn.addEventListener("click", toggleListening);

    // Text Send Handler
    function handleSend() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = "";
      addMessage(text, "user");
      statusText.textContent = "Thinking...";
      processUserMessage(text);
    }

    sendBtn.addEventListener("click", handleSend);
    textInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleSend();
    });

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function getSystemInstruction() {
      return `
You are a friendly, conversational voice host for a restaurant.

LIVE RESTAURANT DATA & MENU:
${dynamicRestaurantInfo}

RULES:
1. Use the live data above to answer all customer questions regarding dishes, prices, timings, and policies.
2. Handle table reservations politely by collecting: Name, Phone Number, Number of Guests, Date & Time.
3. Once you have ALL 4 details, reply with a short confirmation message and append this exact tag at the end:
   [BOOKING: {"customer_name": "NAME", "phone": "PHONE", "guests": GUESTS_INT, "date_time": "DATETIME"}]
4. Keep all spoken responses short (1-2 sentences) and natural.
`;
    }

    // Call Gemini API
    async function processUserMessage(userInput) {
      conversationHistory.push({ role: "user", parts: [{ text: userInput }] });

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: getSystemInstruction()] } },
            contents: conversationHistory
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiResponse = data.candidates[0].content.parts[0].text;
        conversationHistory.push({ role: "model", parts: [{ text: aiResponse }] });

        const bookingMatch = aiResponse.match(/\[BOOKING:\s*(\{.*?\})\]/);
        let spokenResponse = aiResponse;

        if (bookingMatch) {
          spokenResponse = aiResponse.replace(bookingMatch[0], "").trim();
          try {
            const bookingData = JSON.parse(bookingMatch[1]);
            saveToGoogleSheet(bookingData);
          } catch (e) {
            console.error("Failed to parse booking JSON:", e);
          }
        }

        addMessage(spokenResponse, "bot");
        speakText(spokenResponse);

      } catch (error) {
        console.error("Gemini API Error:", error);
        const err = "Sorry, I ran into an issue connecting to the AI.";
        addMessage(err, "bot");
        speakText(err);
      } finally {
        statusText.textContent = "Ready — Tap mic or type below";
      }
    }

    // Save reservation to Google Sheets
    async function saveToGoogleSheet(bookingData) {
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bookingData)
        });
        console.log("Reservation recorded in Google Sheet:", bookingData);
      } catch (err) {
        console.error("Error saving booking to Google Sheet:", err);
      }
    }
  </script>
</body>
</html>
