<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Voice Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-active: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.3rem;
      text-align: center;
      color: var(--accent);
    }
    .status {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 14px;
      color: #94a3b8;
    }
    .chat-box {
      height: 320px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 85%;
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .msg.error {
      align-self: center;
      background: #7f1d1d;
      color: #fecaca;
      font-size: 0.85rem;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .input-row input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .input-row button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: center;
    }
    .mic-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }
    .mic-btn.listening {
      background: var(--accent-active);
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍽️ Restaurant Voice Assistant</h1>
    <div class="status" id="statusText">Ready — Tap mic or type below</div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hello! Welcome to our restaurant. Feel free to ask about our menu specials or book a table. How can I help you today?</div>
    </div>

    <div class="input-row">
      <input type="text" id="textInput" placeholder="Ask a dish question or table booking..." autocomplete="off" />
      <button id="sendBtn" type="button">Send</button>
    </div>

    <div class="controls">
      <button class="mic-btn" id="micBtn" type="button">🎙️</button>
    </div>
  </div>

  <script>
    const GEMINI_API_KEY = "AIzaSyCbnQPV-ZMsmYb5Uy9gid8FvTY3GWmOk0Y";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwap82BOPazgkUfm5wwmywH2YfHlsPw5p6cIIo0vmTdIngrGkmd2h81cZU9vdtPshD9cg/exec";

    const systemPrompt = `You are a friendly Japanese restaurant assistant.
Menu:
- Agedashi Tofu (₹350, Veg): Silken tofu in warm savory dashi broth.
- Pan-seared Gyoza (₹420): Japanese dumplings with minced filling.
- Truffle Mushroom Ramen (₹520, Veg): Creamy miso broth with noodles.
- Grilled Salmon Teriyaki (₹750): Norwegian salmon with teriyaki glaze.

Keep answers concise (1-2 sentences). For reservations, collect Name, Phone, Guests, Date/Time.`;

    let conversationHistory = [];
    const chatBox = document.getElementById("chatBox");
    const statusText = document.getElementById("statusText");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    function appendMessage(text, role) {
      const msg = document.createElement("div");
      msg.className = `msg ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(u);
    }

    async function sendMessage(userText) {
      if (!userText || !userText.trim()) return;

      appendMessage(userText, "user");
      textInput.value = "";
      statusText.textContent = "Thinking...";

      conversationHistory.push({ role: "user", parts: [{ text: userText }] });

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: conversationHistory
          })
        });

        const data = await res.json();

        if (data.error) {
          appendMessage("Error: " + data.error.message, "error");
          statusText.textContent = "API error";
          return;
        }

        const reply = data.candidates[0].content.parts[0].text;
        conversationHistory.push({ role: "model", parts: [{ text: reply }] });

        appendMessage(reply, "bot");
        speak(reply);
        statusText.textContent = "Ready — Tap mic or type below";

      } catch (err) {
        appendMessage("Network error: " + err.message, "error");
        statusText.textContent = "Connection error";
      }
    }

    // Direct Event Listeners
    sendBtn.onclick = () => sendMessage(textInput.value);
    textInput.onkeydown = (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage(textInput.value);
      }
    };

    // Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let listening = false;

    if (SpeechRecognition) {
      rec = new SpeechRecognition();
      rec.lang = "en-US";

      rec.onstart = () => {
        listening = true;
        micBtn.classList.add("listening");
        statusText.textContent = "Listening... Speak now";
      };

      rec.onresult = (e) => {
        const speech = e.results[0][0].transcript;
        sendMessage(speech);
      };

      rec.onerror = () => {
        listening = false;
        micBtn.classList.remove("listening");
        statusText.textContent = "Mic error";
      };

      rec.onend = () => {
        listening = false;
        micBtn.classList.remove("listening");
        statusText.textContent = "Ready — Tap mic or type below";
      };

      micBtn.onclick = () => {
        if (listening) {
          rec.stop();
        } else {
          rec.start();
        }
      };
    } else {
      micBtn.onclick = () => alert("Voice input requires Google Chrome.");
    }
  </script>
</body>
</html>
