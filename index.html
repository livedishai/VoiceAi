<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Voice Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --accent-active: #ef4444;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
      color: var(--accent);
    }
    .status {
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 20px;
      color: #94a3b8;
    }
    .chat-box {
      height: 360px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.4;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .mic-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      outline: none;
    }
    .mic-btn.listening {
      background: var(--accent-active);
      color: white;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍽️ Restaurant Voice Assistant</h1>
    <div class="status" id="statusText">Loading restaurant info...</div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hello! Welcome to our restaurant. Feel free to ask about our menu or reserve a table!</div>
    </div>

    <div class="controls">
      <button class="mic-btn" id="micBtn" title="Click to Speak">🎙️</button>
    </div>
  </div>

  <script>
    // Retrieves stored key or prompts once (avoids GitHub secret scanner blocks)
    let GEMINI_API_KEY = localStorage.getItem("GEMINI_KEY");
    if (!GEMINI_API_KEY) {
      GEMINI_API_KEY = prompt("Enter your Gemini API Key:");
      if (GEMINI_API_KEY) localStorage.setItem("GEMINI_KEY", GEMINI_API_KEY);
    }

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwap82BOPazgkUfm5wwmywH2YfHlsPw5p6cIIo0vmTdIngrGkmd2h81cZU9vdtPshD9cg/exec";

    let dynamicRestaurantInfo = "Default Japanese restaurant details and table booking.";
    let conversationHistory = [];

    const chatBox = document.getElementById("chatBox");
    const micBtn = document.getElementById("micBtn");
    const statusText = document.getElementById("statusText");

    // Fetch dynamic menu & info from Google Sheets on startup
    async function loadRestaurantInfo() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data && data.info) {
          dynamicRestaurantInfo = data.info;
          console.log("Loaded info from Google Sheet:\n", dynamicRestaurantInfo);
        }
      } catch (e) {
        console.warn("Could not load dynamic sheet info, using fallback.", e);
      } finally {
        statusText.textContent = "Tap the microphone to speak";
      }
    }
    loadRestaurantInfo();

    function getSystemInstruction() {
      return `
You are a friendly, conversational voice assistant for this restaurant.

LIVE RESTAURANT DATA & MENU FROM DATABASE:
${dynamicRestaurantInfo}

RULES:
1. Use the live data above to answer all customer questions regarding dishes, prices, timings, and policies.
2. Handle table reservations politely by collecting: Name, Phone Number, Number of Guests, Date & Time.
3. Once you have ALL 4 details, reply with a short confirmation message and append this exact tag at the end:
   [BOOKING: {"customer_name": "NAME", "phone": "PHONE", "guests": GUESTS_INT, "date_time": "DATETIME"}]
4. Keep all spoken responses short (1-2 sentences) and natural.
`;
    }

    // Web Speech API Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
        statusText.textContent = "Listening... Speak now";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        addMessage(transcript, "user");
        statusText.textContent = "Thinking...";
        await processUserMessage(transcript);
      };

      recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        statusText.textContent = "Error listening. Tap mic to try again.";
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      statusText.textContent = "Web Speech API is not supported in this browser. Please use Chrome.";
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove("listening");
      statusText.textContent = "Tap the microphone to speak";
    }

    micBtn.addEventListener("click", toggleListening);

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    async function processUserMessage(userInput) {
      if (!GEMINI_API_KEY) {
        const err = "Gemini API key is required.";
        addMessage(err, "bot");
        return;
      }

      conversationHistory.push({ role: "user", parts: [{ text: userInput }] });

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: getSystemInstruction()] } },
            contents: conversationHistory
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiResponse = data.candidates[0].content.parts[0].text;
        conversationHistory.push({ role: "model", parts: [{ text: aiResponse }] });

        const bookingMatch = aiResponse.match(/\[BOOKING:\s*(\{.*?\})\]/);
        let spokenResponse = aiResponse;

        if (bookingMatch) {
          spokenResponse = aiResponse.replace(bookingMatch[0], "").trim();
          try {
            const bookingData = JSON.parse(bookingMatch[1]);
            saveToGoogleSheet(bookingData);
          } catch (e) {
            console.error("Failed to parse booking JSON:", e);
          }
        }

        addMessage(spokenResponse, "bot");
        speakText(spokenResponse);

      } catch (error) {
        console.error("Gemini API Error:", error);
        const err = "Sorry, I ran into an issue connecting to the AI.";
        addMessage(err, "bot");
        speakText(err);
      } finally {
        statusText.textContent = "Tap the microphone to speak";
      }
    }

    async function saveToGoogleSheet(bookingData) {
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bookingData)
        });
        console.log("Reservation recorded in Google Sheet:", bookingData);
      } catch (err) {
        console.error("Error saving booking to Google Sheet:", err);
      }
    }
  </script>
</body>
</html>
